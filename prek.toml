# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

# Rust checks, matching what CI runs so a push never fails on something a commit
# could have caught. All three use `pass_filenames = false`: cargo works on
# crates, not on the file list a hook is handed, and passing paths it does not
# understand would make it ignore them or fail.
[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all --check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy-silicon", name = "cargo clippy (silicon build)", entry = "cargo clippy --workspace --all-targets --features tt-tests/silicon -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },

    # The firmware is a separate workspace targeting riscv32im, so the host
    # workspace's clippy never sees it. `--bins --lib` rather than
    # `--all-targets`: there are no test targets, and asking for them fails
    # looking for a `test` crate that does not exist for a no_std target.
    { id = "cargo-clippy-firmware", name = "cargo clippy (firmware)", entry = "cargo clippy --manifest-path crates/tt-firmware/Cargo.toml --target riscv32im-unknown-none-elf --bins --lib -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
    # The same for the mover's fast read modes (`fast-reads`, which `encoded-guard` implies): a different image.
    { id = "cargo-clippy-firmware-guard", name = "cargo clippy (firmware, encoded-guard)", entry = "cargo clippy --manifest-path crates/tt-firmware/Cargo.toml --target riscv32im-unknown-none-elf --bins --lib --features encoded-guard -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },

    # Native dispatch and unsupported methods follow the pinned Burn traits.
    # A Burn bump or a hand-edit of generated operations fails here.
    { id = "cargo-xtask-gen-burn-ops", name = "generated Burn operations are current", entry = "cargo xtask gen-burn-ops --check", language = "system", files = "^(crates/burn-tt/src/|xtask/src/|Cargo\\.(toml|lock)|PINS\\.toml)", pass_filenames = false },
    # Every unsupported Burn method needs a disposition (a reasoned `[-]`),
    # and a disposition for a method that now works is stale.
    { id = "cargo-xtask-burn-coverage", name = "Burn operation coverage is current", entry = "cargo xtask burn-coverage --check", language = "system", files = "^(crates/burn-tt/src/|xtask/src/|docs/plans/burn-op-coverage\\.md|Cargo\\.(toml|lock)|PINS\\.toml)", pass_filenames = false },
    { id = "cargo-xtask-no-flex", name = "Burn backend is independent of Flex", entry = "cargo xtask check-no-flex-in-backend", language = "system", files = "^(crates/burn-tt/|xtask/src/|Cargo\\.(toml|lock)|PINS\\.toml)", pass_filenames = false },
]
